services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: runtime
    command: ["migrate"]
    env_file: ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./postgres:/app/postgres:ro

  backend:
    build:
      context: ./backend
      target: runtime
    env_file: ${ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./corpus:/app/corpus:ro
      - ./postgres:/app/postgres:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

  vllm-llm:
    profiles: [offline]
    image: vllm/vllm-openai:v0.31.0
    command: >-
      --model ${LLM_LOCAL_MODEL}
      --served-model-name ${SELECTION_MODEL}
      --max-model-len ${LLM_MAX_MODEL_LEN}
      ${VLLM_LLM_EXTRA_ARGS:-}
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  vllm-embed:
    profiles: [offline]
    image: vllm/vllm-openai:v0.31.0
    command: >-
      --model ${EMBEDDING_LOCAL_MODEL}
      --served-model-name ${EMBEDDING_MODEL}
      ${VLLM_EMBED_EXTRA_ARGS:-}
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  db-test:
    profiles: [test]
    image: pgvector/pgvector:0.8.7-pg17
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d test"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: dev
    environment:
      TEST_DATABASE_URL: postgresql://app:test@db-test:5432/test
      PYTHONPATH: /app/src:/app
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./eval:/app/eval
      - ./postgres:/app/postgres:ro
      - ./corpus:/app/corpus:ro
      - ./.env.example:/env/.env.example:ro
      - ./.env.offline.example:/env/.env.offline.example:ro
      - ./docker-compose.yml:/repo/docker-compose.yml:ro
      - ./Makefile:/repo/Makefile:ro
      - ./docs/OFFLINE.md:/repo/docs/OFFLINE.md:ro
      - ./README.md:/repo/README.md:ro
    working_dir: /app

  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      target: dev
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./frontend:/app
    working_dir: /app

volumes:
  pgdata: {}
  hf-cache: {}
