name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file (online profile)
        run: ENV_FILE=.env.example docker compose --env-file .env.example config --quiet

      - name: Validate compose file (offline profile)
        run: >-
          ENV_FILE=.env.offline.example
          docker compose --env-file .env.offline.example --profile offline config --quiet

      # Tests use the Dockerfiles' dev stage; this catches a broken runtime stage.
      - name: Build runtime images
        run: make build

      - name: Lint
        run: make lint

      - name: Backend tests (unit, api, db)
        run: make test

      - name: Frontend tests
        run: make test-frontend
