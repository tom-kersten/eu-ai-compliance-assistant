[project]
name = "backend"
version = "0.1.0"
description = "EU AI compliance assistant API"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pgvector>=0.4.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
cache_dir = "/tmp/pytest_cache"
addopts = "-m 'not live'"
markers = [
    "unit: no network and no database",
    "db: real pgvector database (db-test)",
    "api: HTTP endpoints with fake providers",
    "live: real providers; opt-in only",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]
# Like pytest's cache_dir: keep caches out of the bind-mounted source, which the
# container user cannot write when the host UID differs (e.g. CI runners).
cache-dir = "/tmp/ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# eval/ is mounted at /app/eval rather than living under a `src` root, so
# ruff cannot detect it as first-party on its own.
known-first-party = ["app", "eval", "scripts"]
